# Production / self-hosted stack.
#
#   cloudflared -> nginx:80 -> app:9000 -> postgres:5432
#
# Only cloudflared reaches the internet. nginx, app and postgres publish no
# host ports at all — verify with `docker compose ps` that the PORTS column
# is empty for everything except (optionally) nginx during local testing.
#
# Works with `docker compose up -d` or `podman-compose up -d`.

name: fraseario_prod

networks:
  fraseario:
    driver: bridge

volumes:
  pgdata:
    external: true
    name: fraseario_pgdata    
  app_public:
  storage_data:

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      # nginx needs to read public/ to serve static files and hashed assets.
      # Sharing it through a named volume avoids duplicating the build output
      # into the nginx image.
      - app_public:/var/www/html/public
      - storage_data:/var/www/html/storage
    networks: [fraseario]
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: docker.io/library/nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_public:/var/www/html/public:ro
    networks: [fraseario]
    depends_on: [app]

  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [fraseario]
    healthcheck:
      # Gates the app container's startup — without this the app can boot
      # before Postgres finishes initialising on a cold start.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks: [fraseario]
    depends_on: [nginx]
